appId: com.researchnotion.desktop
productName: ResearchNotion
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  - "!dist/**/*.map"
extraResources:
  - from: node_modules/pdfjs-dist/standard_fonts
    to: standard_fonts
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/research-notion.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ResearchNotion
asar: true
asarUnpack:
  - "**/better-sqlite3/**"
  - "**/@napi-rs/canvas/**"
